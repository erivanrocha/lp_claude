# Configuração do Cloudflare Pages + D1 (ver README.md)
name = "nvo-endereco-fiscal"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nvo-endereco-fiscal"
# SUBSTITUIR QUANDO DISPONÍVEL: ID gerado por `npx wrangler d1 create nvo-endereco-fiscal`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
